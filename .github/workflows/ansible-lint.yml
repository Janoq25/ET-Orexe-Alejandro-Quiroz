---
name: ansible-lint

on:
  push:
    branches:
      - feature/evaluacion-orexe
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.1.3
        with:
          working_directory: ansible
          args: site.yml roles
